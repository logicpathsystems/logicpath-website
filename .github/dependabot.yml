version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v4 excludes dotfiles from the Pages artifact, which would drop
      # /.well-known/security.txt. Revisit only with a replacement for it.
      - dependency-name: actions/upload-pages-artifact
        update-types: ["version-update:semver-major"]
